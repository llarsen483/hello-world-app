<header class="topbar">

  <button
    class="burger"
    type="button"
    (click)="menu.toggleMenu()"
    [class.open]="menu.menuVisible()">

    <span></span>
    <span></span>
    <span></span>

  </button>

  <h1>Hello World App</h1>

</header>

<div class="container">

  @if (menu.menuVisible()) {

    <nav class="sidebar">

      <a
        routerLink="/welcome"
        routerLinkActive="active"
        (click)="menu.closeMenuIfMobile()">
        Welcome
      </a>

      <a
        routerLink="/news"
        routerLinkActive="active"
        (click)="menu.closeMenuIfMobile()">
        News
      </a>

      <a
        routerLink="/rules"
        routerLinkActive="active"
        (click)="menu.closeMenuIfMobile()">
        Rules
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active"
        (click)="menu.closeMenuIfMobile()">
        Contact
      </a>

    </nav>

  }

  <main class="content">
    <router-outlet />
  </main>

</div>
