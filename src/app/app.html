<header class="topbar">

  <button
    class="burger"
    (click)="toggleMenu()">
    ☰
  </button>

  <h1>{{ title() }}</h1>

</header>

<div class="container">

  @if (menuVisible()) {

    <nav class="sidebar">

  <a
    routerLink="/welcome"
    routerLinkActive="active"
    (click)="closeMenuIfMobile()">
    Welcome
  </a>

  <a
    routerLink="/news"
    routerLinkActive="active"
    (click)="closeMenuIfMobile()">
    News
  </a>

  <a
    routerLink="/rules"
    routerLinkActive="active"
    (click)="closeMenuIfMobile()">
    Rules
  </a>

  <a
    routerLink="/contact"
    routerLinkActive="active"
    (click)="closeMenuIfMobile()">
    Contact
  </a>

    </nav>

  }

  <main class="content">
    <router-outlet />
  </main>

</div>
